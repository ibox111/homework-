<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Bootstrap HW</title>
		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous" />
	</head>
	<body>
		<div class="container d-grid gap-3 pt-3 pb-3">
			<section class="border rounded">
				<div
					class="bg-success-subtle rounded p-4 d-inline-flex gap-3 align-items-center w-100 flex-wrap">
					<h2 class="bg-success text-white rounded m-0 p-3 pt-1 pb-1">2</h2>
					<h2 class="m-0">Bootstrap Text Color</h2>
				</div>
				<div class="d-flex gap-3 justify-content-between p-4 flex-wrap">
					<p class="text-primary">Primary Text</p>
					<p class="text-secondary">Secondary Text</p>
					<p class="text-success">Success Text</p>
					<p class="text-danger">Danger Text</p>
					<p class="text-warning">Warning Text</p>
					<p class="text-info">Info Text</p>
				</div>
			</section>
			<section class="border rounded">
				<div
					class="bg-primary-subtle rounded p-4 d-inline-flex gap-3 align-items-center w-100 flex-wrap">
					<h2 class="bg-primary text-white rounded m-0 p-3 pt-1 pb-1">3</h2>
					<h2 class="m-0">Bootstrap Background Color</h2>
				</div>
				<div class="d-flex gap-2 p-4 flex-wrap justify-content-between">
					<p class="bg-primary p-3 pt-1 pb-1 text-white">Primary</p>
					<p class="bg-secondary p-3 pt-1 pb-1 text-white">Secondary</p>
					<p class="bg-success p-3 pt-1 pb-1 text-white">Success</p>
					<p class="bg-danger p-3 pt-1 pb-1 text-white">Danger</p>
					<p class="bg-warning p-3 pt-1 pb-1 text-white">Warning</p>
					<p class="bg-info p-3 pt-1 pb-1 text-white">Info</p>
					<p class="bg-light p-3 pt-1 pb-1 text-dark">Light</p>
					<p class="bg-dark p-3 pt-1 pb-1 text-white">Dark</p>
				</div>
			</section>
		</div>
		<!-- Bootstrap JS -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"></script>
	</body>
</html>
